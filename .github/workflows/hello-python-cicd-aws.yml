name: Hello Python App to AWS EKS

on: [push]
  #push:
   # branches:
   #   - main
   # paths:
   #   - "docker/app1-hello/python"
#  workflow_dispatch:

jobs:
    build-test:
        runs-on: ubuntu-latest

        steps:
          - name: Checkout code
            uses: actions/checkout@v6

          - name: Setup Python
            uses: actions/setup-python@v6
            with:
              python-version: '3.13'       

          - name: Install Dependencies
            working-directory: docker/app1-hello/python
            run: |
              python -m pip install --upgrade pip
              pip install -r requirements.txt

          - name: Run Smoke Test
            working-directory: docker/app1-hello/python
            run: python -m py_compile main.py

    docker-build-push:
        runs-on: ubuntu-latest
        needs: build-test

        steps:
          - name: Checkout code
            uses: actions/checkout@v6

          - name: Login to Docker Hub
            uses: docker/login-action@v3
            with:
              username: ${{ secrets.DOCKERHUB_USERNAME }}
              password: ${{ secrets.DOCKERHUB_PASSWORD }}            

          - name: Build and Push Image
            uses: docker/build-push-action@v6
            with:
              context: docker/app1-hello/python
              push: true
              tags: |
                ${{ secrets.DOCKERHUB_USERNAME }}/hello-python:latest
                
    deploy:
      runs-on: ubuntu-latest
      needs: docker-build-push

      steps:
        - name: Deploy to EC2
          uses: appleboy/ssh-action@v1.2.2
          with:
            host: ${{ secrets.EC2_HOST }}
            username: ${{ secrets.EC2_USER }}
            key: ${{ secrets.EC2_KEY_ID }}

            script: |
              docker pull ${{ secrets.DOCKERHUB_USERNAME }}/hello-python:latest

              docker stop hello-python || true
              docker rm hello-python || true

              docker run -d \
                --restart always \
                --name hello-python \
                -p 80:3000 \
                -e ENV_VALUE=Production \
                ${{ secrets.DOCKERHUB_USERNAME }}/hello-python:latest

